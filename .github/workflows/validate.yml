name: Validate news

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    name: Check news.json and community standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the feed
        run: node scripts/validate-news.mjs
